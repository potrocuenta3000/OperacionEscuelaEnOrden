<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Operación: Escuela en Orden</title>
    <link
rel="icon"
type="image/png"
href="../img/favicon.png">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="contenedor">
        <div class="avatar" aria-hidden="true">👨‍🎓</div>

        <h1>REGISTRO DE JUGADOR</h1>

        <form class="formulario" id="formRegistro" action="#" method="post">
            <label for="usuario">Usuario</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ingresa un usuario"
                autocomplete="username"
                required
            >

            <label for="personaje">Nombre del personaje</label>
            <input
                type="text"
                id="personaje"
                name="personaje"
                placeholder="Ejemplo: GuardianDavid"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa una contraseña"
                autocomplete="new-password"
                required
            >

            <button id="btnRegistrar" type="submit">
                REGISTRARSE
            </button>
        </form>
    </main>

    <script src="../js/app.js"></script>
</body>
</html>
