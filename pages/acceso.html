<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>
<link
rel="icon"
type="image/png"
href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="contenedor">

        <h1>ACCESO AL JUEGO</h1>

        <button id="btnIrLogin">
            INICIAR SESIÓN
        </button>

        <br><br>

        <button id="btnIrRegistro">
            REGISTRARSE
        </button>

    </div>

    <script>
        document
            .getElementById("btnIrLogin")
            .addEventListener("click", () => {

                window.location.href =
                    "login.html";

            });

        document
            .getElementById("btnIrRegistro")
            .addEventListener("click", () => {

                window.location.href =
                    "registro.html";

            });
    </script>

</body>
</html>
