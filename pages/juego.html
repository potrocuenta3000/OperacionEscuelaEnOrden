    <script>
        let personalizacion = null;

        try {
            const datosGuardados = localStorage.getItem("personalizacion");
            personalizacion = datosGuardados
                ? JSON.parse(datosGuardados)
                : null;
        } catch (error) {
            console.error("No se pudo leer la personalización guardada:", error);
        }

        if (personalizacion && typeof personalizacion === "object") {
            const nombreJugador = document.getElementById("nombreJugador");
            const jugador = document.getElementById("jugador");

            if (personalizacion.nombreVisible) {
                nombreJugador.textContent = personalizacion.nombreVisible;
            }

            if (personalizacion.color) {
                jugador.style.backgroundColor = personalizacion.color;
            }
        }
    </script>
